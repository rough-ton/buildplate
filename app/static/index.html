<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buildplate</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="/styles.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.min.js" } }
  </script>
  <script src="/vendor/codemirror/codemirror.js"></script>
  <script src="/vendor/codemirror/simple.js"></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <div class="brand brand-lg"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg><span>Buildplate</span></div>
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required autofocus>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </div>

  <div class="shell" id="shell">
    <nav class="rail" aria-label="Main">
      <a class="brand" href="#/studio"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg><span>Buildplate</span></a>
      <a class="nav" href="#/studio" data-route="studio"><svg viewBox="0 0 24 24"><path d="M4 18 12 22l8-4V8l-8-4-8 4z M4 8l8 4 8-4 M12 12v10"/></svg><span>Studio</span></a>
      <a class="nav" href="#/library" data-route="library"><svg viewBox="0 0 24 24"><path d="M4 4h6v16H4z M14 4h6v7h-6z M14 15h6v5h-6z"/></svg><span>Library</span></a>
      <a class="nav" href="#/usage" data-route="usage"><svg viewBox="0 0 24 24"><path d="M4 20V10 M10 20V4 M16 20v-7 M22 20H2"/></svg><span>Usage</span></a>
      <a class="nav" href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><path d="M4 6h10 M18 6h2 M4 12h4 M12 12h8 M4 18h12 M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></a>
      <a class="nav" href="#/docs" data-route="docs"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z M14 3v5h5 M9 12h7 M9 16h7"/></svg><span>Docs</span></a>
      <div class="rail-foot">
        <div class="model-chip" id="model-chip" title="Active AI model"></div>
        <button class="btn btn-ghost btn-sm" id="logout" hidden>Sign out</button>
        <a class="bmc-btn bmc-btn-sm" href="https://www.buymeacoffee.com/mikeroughton" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#coffee"/></svg><span>Buy me a coffee</span></a>
      </div>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="coffee" viewBox="0 0 24 24">
      <path d="M5 8h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16" fill="none" stroke="#000" stroke-width="1.6"/>
      <path d="M8.5 2.5c-.8 1 .8 2 0 3 M12 2.5c-.8 1 .8 2 0 3" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="mark" viewBox="0 0 32 32">
      <path d="M5 23h22" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M8 19h16 M10 15h12 M12 11h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".55"/>
      <path d="M16 3v5" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M13 6l3 3 3-3" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </symbol>
  </svg>
  <script type="module" src="/app.js"></script>
</body>
</html>
