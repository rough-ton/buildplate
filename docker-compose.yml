services:
  buildplate:
    image: ghcr.io/rough-ton/buildplate:latest
    container_name: buildplate
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      TZ: America/Denver
      PUID: 1000
      PGID: 1000
      # Optional first-run conveniences. Everything here can also be set in the web UI.
      # BUILDPLATE_ADMIN_PASSWORD: change-me
      # ANTHROPIC_API_KEY: sk-ant-...
      # OLLAMA_BASE_URL: http://192.168.1.10:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
