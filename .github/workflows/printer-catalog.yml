name: Refresh printer catalog

on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OrcaSlicer profiles
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/SoftFever/OrcaSlicer /tmp/orca
          git -C /tmp/orca sparse-checkout set resources/profiles
      - name: Rebuild catalog
        run: python3 tools/build_printer_db.py /tmp/orca
      - name: Ignore date-only changes
        run: |
          if git diff --quiet -I '"generated"' -I '"source_commit"' -- app/data/printer_db.json; then
            git checkout -- app/data/printer_db.json
          fi
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/printer-catalog
          commit-message: Refresh printer catalog from OrcaSlicer
          title: Refresh printer catalog
          body: Regenerated app/data/printer_db.json from the latest OrcaSlicer printer profiles.
          delete-branch: true
